server:
  # A test stops each application it boots, and nothing should wait out Jetty's graceful stop.
  shutdownGracePeriod: 0s
  applicationConnectors:
  - type: http
    bindHost: 127.0.0.1
  adminConnectors:
  - type: http
    bindHost: 127.0.0.1
logging:
  level: INFO
  loggers:
    org.metadatacenter: DEBUG
  appenders:
    - type: console
      threshold: ALL
      timeZone: UTC
      target: stdout
